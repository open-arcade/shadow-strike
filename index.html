<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Strike</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0708;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0708}}
:root[data-theme="dark"]{--bg:#0a0708}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.5));aspect-ratio:3/2;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
</style></head><body><canvas id="c" width="1350" height="900"></canvas>
<script>
const W=675,H=450,GR=900,GY=420,FONT='"Permanent Marker",Impact,sans-serif',INK='#0a0708';
const cv=document.getElementById('c'),g=cv.getContext('2d');
let S={best:0,coins:0,own:[0],eq:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('lastninja')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lastninja',JSON.stringify(S))}catch(e){}};
const BANDS=[['#d8222a',0],['#2a7de1',150],['#2fb552',300],['#f08a24',400],['#d8222a',600]];
const rnd=(a,b)=>a+Math.random()*(b-a);
let muted=true,ac;
function initA(){}
function snd(f,d,type='square',v=.05,sl=0){if(muted||!ac)return;try{const o=ac.createOscillator(),a=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

function nz(d,v,f0,f1,att,type,q){if(muted||!ac)return;try{const n=ac.currentTime,b=ac.createBuffer(1,Math.ceil(ac.sampleRate*d),ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const sr=ac.createBufferSource();sr.buffer=b;const f=ac.createBiquadFilter();f.type=type||'bandpass';f.Q.value=q||1;f.frequency.setValueAtTime(f0,n);f.frequency.exponentialRampToValueAtTime(f1,n+d);const gn=ac.createGain();gn.gain.setValueAtTime(att?.001:v,n);if(att)gn.gain.linearRampToValueAtTime(v,n+d*att);gn.gain.exponentialRampToValueAtTime(.001,n+d);sr.connect(f);f.connect(gn);gn.connect(ac.destination);sr.start()}catch(e){}}
function voice(f0,f1,d,v,a1,b1,a2,b2,rough){if(muted||!ac)return;try{const n=ac.currentTime,o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+d);
const lf=ac.createOscillator(),lg=ac.createGain();lf.frequency.value=rough?26:6;lg.gain.value=f0*(rough?.22:.03);lf.connect(lg);lg.connect(o.frequency);lf.start(n);lf.stop(n+d);
const out=ac.createGain();out.gain.setValueAtTime(.001,n);out.gain.linearRampToValueAtTime(v,n+d*.15);out.gain.exponentialRampToValueAtTime(.001,n+d);
for(const[a,b,q]of[[a1,b1,5],[a2,b2,8]]){const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(a,n);f.frequency.linearRampToValueAtTime(b,n+d);o.connect(f);f.connect(out)}
out.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
function sHit(){nz(.08,.14,4500,1800,0,'highpass');snd(1100,.07,'square',.03,-700);setTimeout(()=>voice(170,100,.32,.4,650,480,1150,900),60)}
function sDie(){voice(120,42,.55,.55,500,300,900,500,1);nz(.4,.12,900,200,0,'bandpass',2);snd(90,.35,'sawtooth',.05,-50)}
function sWhoosh(){nz(1.3,.07,300,1700,.45,'bandpass',.8)}
function sYell(){const r=Math.random();if(r<.34)voice(190,230,.4,.5,330,800,870,1250);else if(r<.67)voice(260,200,.3,.45,300,750,2200,1300);else voice(210,150,.3,.45,750,650,1200,1000);nz(.07,.15,220,80,0,'lowpass')}
/* backgrounds */
const bam=document.createElement('canvas');bam.width=W;bam.height=H;
(function(){const c=bam.getContext('2d'),gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#e8b73e');gr.addColorStop(1,'#f5cc5c');c.fillStyle=gr;c.fillRect(0,0,W,H);
let px=0;while(px<W){const w=rnd(12,34);c.fillStyle='rgba('+(Math.random()<.5?'150,100,10':'255,228,130')+','+rnd(.08,.22)+')';c.fillRect(px,0,w,H);
for(let y=rnd(0,60);y<H;y+=rnd(50,110)){c.fillStyle='rgba(110,70,0,.35)';c.beginPath();c.moveTo(px,y);c.lineTo(px+w*rnd(.3,.8),y+rnd(2,5));c.lineTo(px+w*.3,y+7);c.fill()}px+=w+rnd(4,22)}})();
const vin=document.createElement('canvas');vin.width=W;vin.height=170;
(function(){const c=vin.getContext('2d');c.strokeStyle=c.fillStyle=INK;c.lineCap='round';
for(let i=0;i<3;i++){c.lineWidth=rnd(8,15);c.beginPath();c.moveTo(i*225-25,4);c.quadraticCurveTo(i*225+110,rnd(80,150),i*225+250,4);c.stroke()}
c.fillRect(0,0,W,8);for(let i=0;i<14;i++){const x=rnd(0,W);c.lineWidth=rnd(2,4);c.beginPath();c.moveTo(x,6);c.lineTo(x+rnd(-4,4),rnd(30,80));c.stroke()}})();
const tile=(img,off,y)=>{off=((off%W)+W)%W;g.drawImage(img,-off,y,W,img.height);g.drawImage(img,W-off,y,W,img.height)};

/* state */
let cam=0,camT=0,cvx=0,P,pl,beams=[],ens=[],nxt=[],pils=[],shots=[],parts=[],texts=[],bod=[],run,jD,phase='idle',state='menu',paused=false,cool=0,killT=0,deadT=0,jT=0,jF,drag=null,hint=0,gain=null,shopFrom='menu',newBest=0,ui=[];
const SP=[0,200,400,500,700],HB=[0,.05,.1,.15,.2],DB=[0,.05,.1,.15,.2],SENS=.5;
S.sown=S.sown||[0];S.seq=S.seq||0;S.pown=S.pown||[];
const mk=(x,y,f)=>({x,y,f,hp:5,dead:0,vx:0,vy:0,rot:0,spin:0,air:0,aim:.3,t:0,w:0,bx:0,by:0});
function menuWorld(){cam=camT=0;P={x:110,top:300,off:0};pils=[P,{x:480,top:180,off:0}];pl=mk(110,300,1);pl.aim=.5;ens=[];nxt=[];shots=[];parts=[];texts=[];bod=[];beams=[];phase='idle';state='menu'}
const rl=n=>rnd(2.4,3.8)*Math.max(.65,1-run.lvl*.03)*[1,.75,.55][n.tier||0];
function makeLevel(bx,hold){run.lvl=(run.lvl||0)+1;const lv=run.lvl,c=1+(Math.random()<Math.min(.7,.25+lv*.05)?1:0)+(lv>=6&&Math.random()<.4?1:0),L=[],po=lv>=3?Math.min(.6,(lv-2)*.12):0,pb=lv>=7?Math.min(.5,(lv-6)*.1):0;let x=bx+rnd(240,290);
for(let i=0;i<c;i++){const top=rnd(140,350),p={x,top,off:H-top+10,hold},n=mk(x,-70-i*40,-1),r=Math.random();pils.push(p);n.p=p;n.fall=1;n.fd0=.15+i*.3;n.fd=hold?1e9:n.fd0;
 n.tier=r<pb?2:r<pb+po?1:0;n.col=['#d8222a','#f08a24','#2a7de1'][n.tier];n.wk=0;
 if(lv>=12&&Math.random()<Math.min(.8,(lv-11)*.1))n.wk=1+Math.floor(Math.random()*(2+n.tier));
 if(lv>=50&&Math.random()<.3)n.sp=1+Math.floor(Math.random()*3);
 n.hp=3+(n.sp===1?3:0);n.t=rl(n)+i*.7;L.push(n);x+=rnd(95,120)}return L}
function newGame(){menuWorld();pils=[P];run={score:0,hs:0,kills:0,thr:0,hit:0,lvl:0};ens=makeLevel(P.x+90);cool=0;hint=4;newBest=0;state='play'}
function solve(n){const dx=Math.abs(n.x-pl.x),h=(n.y-30)-(pl.y-24);let v=rnd(480,640)*[1,1.12,1.25][n.tier||0];
for(let i=0;i<20;i++){const d=v**4-GR*(GR*dx*dx+2*h*v*v);if(d>=0)return{a:Math.atan((v*v-Math.sqrt(d))/(GR*dx))+rnd(-1,1)*Math.max(.012,.075-run.lvl*.004)*[1,.6,.25][n.tier||0],v};v*=1.12}return{a:.7,v:700}}
function blood(x,y){for(let i=0;i<10;i++)parts.push({x,y,vx:rnd(-120,120),vy:rnd(-160,40),t:rnd(.4,.9)})}
function addCoins(n){S.coins+=n;gain={n,t:1.2};save()}
function stick(tg,s){if(s.rm)return;(tg.sk=tg.sk||[]).push({dx:s.x-tg.x,dy:s.y-tg.y,r:s.r,k:s.k});s.rm=1}
function dieP(){pl.dead=1;pl.vx=-80;pl.vy=-220;pl.spin=-5;phase='dead';deadT=1.1}
function hurt(d){if(pl.dead)return;if(Math.random()<HB[S.eq])return;pl.hp-=d;blood(pl.x,pl.y-24);sHit();if(pl.hp<=0)dieP()}
function boom(s){s.rm=1;for(let i=0;i<16;i++)parts.push({x:s.x,y:s.y,vx:rnd(-220,220),vy:rnd(-260,60),t:rnd(.3,.7),c:i%2?'#f08a24':'#d8222a'});snd(90,.3,'sawtooth',.1,-40);if(state==='play'&&!pl.dead&&Math.hypot(s.x-pl.x,s.y-pl.y+24)<62)hurt(2)}
function fire(n){const{a,v}=n.sh;n.w=0;n.t=rl(n);
 if(n.sp===2){beams.push({x1:n.x-8,y1:n.y-30,x2:pl.x,y2:pl.y-24,t:.25});hurt(2);snd(700,.3,'sawtooth',.07,-500);return}
 shots.push({x:n.x-8,y:n.y-30,vx:-v*Math.cos(a),vy:-v*Math.sin(a),r:0,o:'e',k:n.sp===3?9:n.wk,d:n.sp===3||n.wk>=3?2:1,bm:n.sp===3?1:0});snd(330,.12,'triangle',.05,-100)}
function kill(tg,s,hs){if(tg!==pl)run.hit++;
if(tg===pl&&!hs){if(Math.random()<HB[S.eq]){s.rm=1;snd(300,.08,'square',.04);return}pl.hp-=s.d||1;stick(tg,s);blood(s.x,s.y);sHit();if(pl.hp>0)return}
else if(tg!==pl&&!hs){tg.hp--;stick(tg,s);blood(s.x,s.y);sHit();if(tg.hp>0)return}
tg.dead=1;tg.vx=s.vx*.25;tg.vy=-220;tg.spin=rnd(-8,8);stick(tg,s);blood(s.x,s.y);sDie();
if(tg!==pl){run.kills++;run.score++;let c=1;if(hs){run.hs++;run.kills++;c=3;texts.push({x:s.x,y:s.y-24,t:1.4})}addCoins(c)}else{phase='dead';deadT=1.1}}
function aimV(){const dx=(drag.cx-drag.sx)*SENS,dy=(drag.cy-drag.sy)*SENS,l=Math.hypot(dx,dy),k=Math.min(1,130/l)*6.4;return{dx,dy,l,vx:dx*k,vy:dy*k}}
function throwShot(){if(!drag)return;const a=aimV();if(a.l<14||a.dx<=2||cool>0)return;
shots.push({x:pl.x+8,y:pl.y-30,vx:a.vx,vy:a.vy,r:0,o:'p',k:S.seq});run.thr++;cool=.35;snd(500,.12,'triangle',.06,300)}

/* update */
function update(dt){
const oc=cam;cam+=(camT-cam)*Math.min(1,dt*5);cvx=(cam-oc)/dt;
if(gain&&(gain.t-=dt)<=0)gain=null;
for(const p of parts){p.vy+=GR*.6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}parts=parts.filter(p=>p.t>0);
for(const t of texts)t.t-=dt;texts=texts.filter(t=>t.t>0);
for(const b of bod){b.vy+=GR*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.spin*dt}bod=bod.filter(b=>b.y<H+100);
for(const p of pils)if(p.off>0&&!p.hold)p.off=Math.max(0,p.off-(p.off*2.5+40)*dt);
if(state==='menu'||state==='shop'&&shopFrom==='menu')return;
cool-=dt;hint-=dt;
for(const n of[pl,...ens])if(n.dead){n.vy+=GR*dt;n.x+=n.vx*dt;n.y+=n.vy*dt;n.rot+=n.spin*dt}
if(state==='play'){
 for(const n of[...ens,...nxt]){if(n.dead)continue;if(n.fall){if((n.fd-=dt)<=0){n.vy+=GR*dt;n.y+=n.vy*dt;if(n.y>=n.p.top+n.p.off){n.y=n.p.top+n.p.off;n.fall=0;n.vy=0;sYell()}}}else n.y=n.p.top+n.p.off}
 if(drag&&phase==='idle'&&!pl.dead)pl.aim=Math.atan2(drag.sy-drag.cy,drag.cx-drag.sx);else pl.aim+=(.3-pl.aim)*Math.min(1,dt*8);
 if(phase==='idle'){
  for(const n of ens){if(n.dead||n.fall||n.p.off>1)continue;n.t-=dt;if(n.t<(n.sp===2?.9:.45)&&!n.w){n.w=1;n.sh=solve(n)}if(n.w)n.aim=n.sh.a;
   if(n.t<=0)fire(n)}
  if(ens.length&&ens.every(e=>e.dead)){phase='kill';killT=.7}}
 if(phase==='kill'&&(killT-=dt)<=0){phase='jump';sWhoosh();jT=0;jD=ens[ens.length-1].p;jF={x:P.x,y:P.top}}
 if(phase==='jump'){jT+=dt;const t=jT,ox=pl.x,oy=pl.y,pk=Math.max(50,Math.min(jF.y,jD.top)-70);pl.air=1;pl.aim=.3;
  if(t<.4){pl.x=jF.x;pl.y=jF.y+(pk-jF.y)*(t/.4)}
  else{camT=jD.x-110;if(!nxt.length)nxt=makeLevel(jD.x,1);const u=Math.min(1,(t-.4)/.85),e=1-(1-u)*(1-u);pl.x=jF.x+(jD.x-jF.x)*e;pl.y=pk+(jD.top-pk)*e;
   if(u>=1){bod.push(...ens);ens=nxt;nxt=[];for(const n of ens){n.fd=n.fd0;n.p.hold=0}P=jD;pl.x=P.x;pl.y=P.top;pl.air=0;phase='idle';snd(140,.1,'square',.05,-60)}}
  if(phase==='jump'){const k=Math.min(1,dt*9);pl.bx+=((pl.x-ox)/dt-cvx-pl.bx)*k;pl.by+=((pl.y-oy)/dt-pl.by)*k}}
 if(phase!=='jump'){const d=Math.max(0,1-dt*12);pl.bx*=d;pl.by*=d}
 if(phase==='dead'&&(deadT-=dt)<=0){state='over';if(run.score>S.best){S.best=run.score;newBest=1;save()}}
}
for(const s of shots){if(s.st)continue;
 for(let i=0;i<3&&!s.st&&!s.rm;i++){const h=dt/3;s.vy+=GR*h;s.x+=s.vx*h;s.y+=s.vy*h;s.r+=h*18;const bn=s.o==='p'?1+DB[S.seq]:1;
  if(s.bm){if(Math.hypot(s.x-pl.x,s.y-pl.y+24)<18||s.y>GY||pils.some(q=>Math.abs(s.x-q.x)<20&&s.y>q.top+(q.off||0))){boom(s);break}continue}
  if(state==='play')for(const tg of s.o==='p'?ens:[pl]){if(tg.dead||s.rm||tg.fall)continue;
   const ax=Math.abs(s.x-tg.x);if(ax<12*bn&&s.y>tg.y-53&&s.y<=tg.y-31){kill(tg,s,1);break}
   if(ax<11*bn&&s.y>tg.y-31&&s.y<tg.y){kill(tg,s,0);break}}
  if(s.rm)break;
  for(const q of pils)if(Math.abs(s.x-q.x)<20&&s.y>q.top+(q.off||0)&&!s.st){s.st=1;s.pq=q;s.oy=s.y-q.top-(q.off||0);snd(120,.08,'square',.04)}
  if(s.y>GY&&!s.st){s.st=1}}}
for(const b of beams)b.t-=dt;beams=beams.filter(b=>b.t>0);
shots=shots.filter(s=>!s.rm&&s.x>cam-250&&s.x<cam+W+450);if(shots.length>90)shots.splice(0,shots.length-90);
pils=pils.filter(p=>p===P||p.x>cam-120);
}

/* drawing helpers */
function T(s,x,y,sz,col='#fff',al='center'){g.save();g.translate(x,y);g.transform(1,0,-.18,1,0,0);g.font=sz+'px '+FONT;g.textAlign=al;g.fillStyle=col;g.fillText(s,0,0);g.restore()}
const circ=(x,y,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
function star(x,y,r,a,fill,n=4){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=fill;g.beginPath();for(let i=0;i<2*n;i++){const q=i%2?r*.38:r,an=i*Math.PI/n;g.lineTo(Math.cos(an)*q,Math.sin(an)*q)}g.closePath();g.moveTo(r*.13,0);g.arc(0,0,r*.13,0,7);g.fill('evenodd');g.restore()}
function shur(x,y,r,a,k){k=k||0;if(k===9){circ(x,y,r*.8,'#111');g.fillStyle='#e8c030';g.fillRect(x-1,y-r*.8-4,2,5);return}if(k===2){g.save();g.translate(x,y);g.rotate(a);g.fillStyle='#2f6fd6';for(let i=0;i<3;i++){g.beginPath();g.arc(Math.cos(i*2.094)*r*.62,Math.sin(i*2.094)*r*.62,r*.38,0,7);g.fill()}g.beginPath();g.moveTo(r*.24,0);g.arc(0,0,r*.24,0,7);g.moveTo(r*.1,0);g.arc(0,0,r*.1,0,7);g.fill('evenodd');g.restore()}else star(x,y,r,a,['#1b1b1b','#f0b82a','','#101010','#c3c9cf'][k],[4,4,0,8,6][k])}
function blur(x,y,vx,vy,sp2){const sp=Math.hypot(vx,vy),f=Math.max(0,Math.min(1,(sp-80)/260));if(f<=0)return;const len=Math.min(170,sp*.18),ux=-vx/sp,uy=-vy/sp,px=-uy,py=ux;g.lineCap='round';g.lineWidth=3;
for(let i=0;i<11;i++){const o=(i-5)*sp2,l=len*(.35+((i*37)%10)/14),sx=x+px*o,sy=y-24+py*o,ex=sx+ux*l,ey=sy+uy*l,al=(.55-Math.abs(i-5)*.07)*f,gr=g.createLinearGradient(sx,sy,ex,ey);gr.addColorStop(0,'rgba(10,7,8,'+al+')');gr.addColorStop(1,'rgba(10,7,8,0)');g.strokeStyle=gr;g.beginPath();g.moveTo(sx,sy);g.lineTo(ex,ey);g.stroke()}}
function coinIcon(x,y,r){circ(x,y,r,'#f5b800');g.strokeStyle='#fff0a8';g.lineWidth=2;g.beginPath();g.arc(x,y,r-2,0,7);g.stroke();g.fillStyle='#c98a00';g.font='bold '+r*1.2+'px sans-serif';g.textAlign='center';g.fillText('$',x,y+r*.42)}
function skull(x,y){circ(x,y-2,9,'#fff');g.fillStyle='#fff';g.fillRect(x-5,y+4,10,6);circ(x-3.5,y-2,2.4,INK);circ(x+3.5,y-2,2.4,INK)}
function cross(x,y,c){g.strokeStyle=c;g.lineWidth=2;g.beginPath();g.arc(x,y,10,0,7);g.moveTo(x-15,y);g.lineTo(x+15,y);g.moveTo(x,y-15);g.lineTo(x,y+15);g.stroke()}
const hot=(x,y,w,h,fn)=>ui.push([x,y,w,h,fn]);
function roundBtn(x,y,r,fn,icon){circ(x,y,r,'#fff');g.fillStyle=g.strokeStyle=INK;icon(x,y);hot(x-r,y-r,2*r,2*r,fn)}

function drawNinja(n,band){g.save();g.translate(n.x-cam,n.y-22);g.rotate(n.rot);g.translate(0,22);g.scale(n.f,1);
g.strokeStyle=g.fillStyle=INK;g.lineWidth=5;g.lineCap='round';g.lineJoin='round';
const a=n.dead?-1.2+Math.sin(n.rot*2)*.6:n.air?1.5:n.aim,L=(x1,y1,x2,y2)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()};
L(0,-31,0,-14);
if(n.air||n.dead||n.fall){L(0,-14,-8,-4);L(0,-14,7,-8)}else{L(0,-14,-5,0);L(0,-14,6,0)}
const hx=Math.cos(a)*17,hy=-Math.sin(a)*17;L(0,-29,hx,-29+hy);L(0,-29,-9,-20+(n.air?-14:0));
g.beginPath();g.arc(0,-40,8.5,0,7);g.fill();
g.strokeStyle=band;g.lineWidth=3;L(-8.5,-42,8.5,-42);L(-8,-42,-15,-39);L(-8,-42,-14,-46);
